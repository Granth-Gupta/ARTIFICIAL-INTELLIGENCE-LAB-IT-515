<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe vs Minimax AI</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-color: #f8fafc;
        --accent-x: #38bdf8;
        --accent-o: #f43f5e;
        --border-color: #334155;
        --hover-color: #475569;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        background-color: var(--card-bg);
        padding: 2rem;
        border-radius: 1rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        text-align: center;
        max-width: 350px;
        width: 100%;
      }

      h1 {
        margin-top: 0;
        margin-bottom: 0.5rem;
        font-size: 1.8rem;
      }

      #status {
        font-size: 1.1rem;
        margin-bottom: 1.5rem;
        color: #94a3b8;
        height: 1.5em;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 1.5rem;
      }

      .cell {
        aspect-ratio: 1;
        background-color: var(--bg-color);
        border: 2px solid var(--border-color);
        border-radius: 0.5rem;
        font-size: 2.5rem;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background-color 0.2s, border-color 0.2s;
      }

      .cell:hover {
        background-color: var(--hover-color);
        border-color: var(--hover-color);
      }

      .cell.x {
        color: var(--accent-x);
      }

      .cell.o {
        color: var(--accent-o);
      }

      .cell.taken {
        cursor: not-allowed;
      }

      #restart-btn {
        background-color: #3b82f6;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        font-weight: bold;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: background-color 0.2s;
        width: 100%;
      }

      #restart-btn:hover {
        background-color: #2563eb;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Tic-Tac-Toe</h1>
      <div id="status">Your turn (X)</div>

      <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>

      <button id="restart-btn" onclick="resetGame()">Restart Game</button>
    </div>

    <script>
      const boardElement = document.getElementById("board");
      const statusElement = document.getElementById("status");
      const cells = document.querySelectorAll(".cell");

      let board = ["", "", "", "", "", "", "", "", ""];
      let isGameActive = true;
      const human = "X";
      const ai = "O";

      const winningConditions = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8], // Rows
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8], // Columns
        [0, 4, 8],
        [2, 4, 6], // Diagonals
      ];

      // Initialize click handlers
      cells.forEach((cell) => {
        cell.addEventListener("click", handleCellClick);
      });

      function handleCellClick(e) {
        const index = e.target.getAttribute("data-index");

        if (
          board[index] !== "" ||
          !isGameActive ||
          statusElement.textContent.includes("AI's")
        ) {
          return;
        }

        makeMove(index, human);

        if (checkWin(board, human)) {
          statusElement.textContent = "You win!";
          isGameActive = false;
          return;
        } else if (isBoardFull(board)) {
          statusElement.textContent = "It's a tie!";
          isGameActive = false;
          return;
        }

        // AI Turn
        statusElement.textContent = "AI's turn...";
        setTimeout(aiMove, 300); // Slight delay for natural feel
      }

      function makeMove(index, player) {
        board[index] = player;
        cells[index].textContent = player;
        cells[index].classList.add(player.toLowerCase(), "taken");
      }

      function aiMove() {
        if (!isGameActive) return;

        const bestSpot = findBestMove(board);
        makeMove(bestSpot, ai);

        if (checkWin(board, ai)) {
          statusElement.textContent = "AI wins!";
          isGameActive = false;
        } else if (isBoardFull(board)) {
          statusElement.textContent = "It's a tie!";
          isGameActive = false;
        } else {
          statusElement.textContent = "Your turn (X)";
        }
      }

      function isBoardFull(currentBoard) {
        return currentBoard.every((cell) => cell !== "");
      }

      function checkWin(currentBoard, player) {
        return winningConditions.some((condition) => {
          return condition.every((index) => currentBoard[index] === player);
        });
      }

      // --- Minimax with Alpha-Beta Pruning Implementation ---

      function findBestMove(currentBoard) {
        let bestScore = -Infinity;
        let move = -1;

        for (let i = 0; i < currentBoard.length; i++) {
          if (currentBoard[i] === "") {
            currentBoard[i] = ai;
            let score = minimax(currentBoard, 0, false, -Infinity, Infinity);
            currentBoard[i] = "";
            if (score > bestScore) {
              bestScore = score;
              move = i;
            }
          }
        }
        return move;
      }

      function minimax(currentBoard, depth, isMaximizing, alpha, beta) {
        if (checkWin(currentBoard, ai)) return 10 - depth;
        if (checkWin(currentBoard, human)) return depth - 10;
        if (isBoardFull(currentBoard)) return 0;

        if (isMaximizing) {
          let maxEval = -Infinity;
          for (let i = 0; i < currentBoard.length; i++) {
            if (currentBoard[i] === "") {
              currentBoard[i] = ai;
              let evaluation = minimax(
                currentBoard,
                depth + 1,
                false,
                alpha,
                beta
              );
              currentBoard[i] = "";
              maxEval = Math.max(maxEval, evaluation);
              alpha = Math.max(alpha, evaluation);
              if (beta <= alpha) break; // Beta cutoff
            }
          }
          return maxEval;
        } else {
          let minEval = Infinity;
          for (let i = 0; i < currentBoard.length; i++) {
            if (currentBoard[i] === "") {
              currentBoard[i] = human;
              let evaluation = minimax(
                currentBoard,
                depth + 1,
                true,
                alpha,
                beta
              );
              currentBoard[i] = "";
              minEval = Math.min(minEval, evaluation);
              beta = Math.min(beta, evaluation);
              if (beta <= alpha) break; // Alpha cutoff
            }
          }
          return minEval;
        }
      }

      function resetGame() {
        board = ["", "", "", "", "", "", "", "", ""];
        isGameActive = true;
        statusElement.textContent = "Your turn (X)";
        cells.forEach((cell) => {
          cell.textContent = "";
          cell.classList.remove("x", "o", "taken");
        });
      }
    </script>
  </body>
</html>
